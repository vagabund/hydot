font_family Cascadia Code
font_size 11
window_padding_width 20

# Не запоминать размер и состояние окна: иначе после разворачивания
# kitty запускается сразу развёрнутым (window-state в ~/.cache/kitty/main.json)
remember_window_size no

# BEGIN_KITTY_THEME
# Spring
include current-theme.conf
# END_KITTY_THEME
