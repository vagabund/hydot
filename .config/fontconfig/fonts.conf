<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- macOS-like rendering: light autofitter (stem darkening works only through it), grayscale AA (stem darkening via FREETYPE_PROPERTIES in hypr/env.lua) -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- same UI font everywhere, not only in GTK -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Geist</family></prefer>
  </alias>
</fontconfig>
